[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "iminuit"
description = "Jupyter-friendly Python frontend for MINUIT2 in C++"
version = "2.32.0"
maintainers = [{ name = "Hans Dembinski", email = "hans.dembinski@gmail.com" }]
readme = "README.rst"
requires-python = ">=3.9"
license = "MIT AND LGPL-2.1-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = ["numpy >=1.21"]

[project.urls]
repository = "https://github.com/scikit-hep/iminuit"
documentation = "https://scikit-hep.org/iminuit"

[dependency-groups]
test = [
    "coverage",
    "ipywidgets",
    "ipykernel; platform_python_implementation=='CPython'",
    "PySide6; platform_python_implementation=='CPython'",
    "joblib",
    "jacobi",
    "matplotlib; platform_python_implementation=='CPython'",
    "numba; platform_python_implementation=='CPython'",
    "numba-stats; platform_python_implementation=='CPython'",
    "pytest",
    "pytest-xdist",
    "pytest-xvfb",
    "pytest-qt; platform_python_implementation=='CPython'",
    "scipy; platform_python_implementation=='CPython'",
    "tabulate",
    "boost_histogram",
    "resample; platform_python_implementation=='CPython'",
    "unicodeitplus",
    "pydantic",
    "annotated_types",
    "nox",
]
doc = [
    "sphinx-rtd-theme", # installs correct sphinx as well
    "nbsphinx",
    "nbconvert",
    "nbformat",
    "jupyter_client",
    "ipykernel",
    "jax",
    "jaxlib",
    "pytest-xdist",
]
dev = [{ include-group = "test" }, { include-group = "doc" }]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
sdist.exclude = ["extern/root"]
sdist.include = [
    "extern/root/math/minuit2/inc",
    "extern/root/math/minuit2/src",
    "extern/root/math/mathcore/inc/Math/Util.h",
    "extern/root/math/mathcore/inc/Math/Types.h",
    "extern/root/math/mathcore/src/Util.cxx",
    "extern/root/core/foundation/inc",
]
## Uncomment to debug C++
# cmake.build-type = "DEBUG"
## Uncomment to debug C++ build
# build.verbose = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-q", "-ra", "--ff", "--strict-config", "--strict-markers"]
log_level = "INFO"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error::PendingDeprecationWarning",
    "error::DeprecationWarning",
    "error::FutureWarning",
]

[tool.ruff]
show-fixes = true
extend-exclude = ["extern/*"]
lint.extend-select = [
    "B", # flake8-bugbear
    "D", # pydocstyle
]
lint.ignore = [
    "D212", # multi-line-summary-first-line
    "I", # TODO
    "UP", # TODO
    "PL", # TODO
    "SIM", # TODO
    "BLE001", # TODO
    "C401", # TODO
    "DTZ011", # TODO
    "FA100", # TODO
    "FLY002", # TODO
    "PIE790", # TODO
    "PT031", # TODO
    "RUF013", # TODO
    "RUF046", # TODO
    "RUF059", # TODO
    "RUF023", # TODO
    "RUF022", # TODO
    "RUF010", # TODO
    "S110", # TODO
    "TRY004", # TODO
]
lint.pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["B", "D"]
"conftest.py" = ["B", "D"]
"*.ipynb" = ["B", "D"]
"automatic_differentiation.ipynb" = ["F821"]
"cython.ipynb" = ["F821"]
".ci/*.py" = ["D"]
"bench/*.py" = ["D"]
"doc/*.py" = ["B", "D"]

[tool.mypy]
ignore_missing_imports = true
allow_redefinition = true
pretty = true
files = ["src"]
no_implicit_optional = false

[tool.cibuildwheel]
build-frontend = "build[uv]"
skip = [
    "cp39-musllinux_i686", # no numpy wheel
    "*t-win32",            # no numpy wheel
]
test-requires = "pytest"
test-command = "python -m pytest {package}/tests"

[tool.cibuildwheel.environment]
# this makes sure that we build only on platforms that have a corresponding numpy wheel
UV_ONLY_BINARY = ":all:"
PIP_ONLY_BINARY = ":all:"

[[tool.cibuildwheel.overrides]]
# to match numpy, we use manylinux2014 for cp310 (and 3.9, since manylinux2010 is dead)
select = "cp3{9,10}-manylinux*"
manylinux-x86_64-image = "manylinux2014"
manylinux-i686-image = "manylinux2014"
